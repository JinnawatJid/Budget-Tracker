<script>
        // Number Pad Logic
        const amountDisplay = document.getElementById('amountDisplay');
        const numKeys = document.querySelectorAll('.num-key');
        const backspace = document.getElementById('backspace');
        let currentAmount = '0';

        numKeys.forEach(key => {
            key.addEventListener('click', () => {
                const val = key.innerText;
                if (currentAmount === '0' && val !== '.') {
                    currentAmount = val;
                } else {
                    if (val === '.' && currentAmount.includes('.')) return;
                    currentAmount += val;
                }
                updateDisplay();
            });
        });

        backspace.addEventListener('click', () => {
            currentAmount = currentAmount.slice(0, -1);
            if (currentAmount === '' || currentAmount === '-') currentAmount = '0';
            updateDisplay();
        });

        function updateDisplay() {
            amountDisplay.innerText = currentAmount;
        }

        // Toggle Logic
        const expenseTab = document.getElementById('expenseTab');
        const incomeTab = document.getElementById('incomeTab');

        expenseTab.addEventListener('click', () => {
            expenseTab.className = "flex-1 py-2 px-4 rounded-full font-bold text-label-md transition-all bg-primary-container text-on-primary-container border-2 border-on-surface sticker-shadow";
            incomeTab.className = "flex-1 py-2 px-4 rounded-full font-bold text-label-md transition-all text-on-surface-variant";
        });

        incomeTab.addEventListener('click', () => {
            incomeTab.className = "flex-1 py-2 px-4 rounded-full font-bold text-label-md transition-all bg-primary-container text-on-primary-container border-2 border-on-surface sticker-shadow";
            expenseTab.className = "flex-1 py-2 px-4 rounded-full font-bold text-label-md transition-all text-on-surface-variant";
        });

        // Bottom Sheet Toggle (Micro-interaction)
        const scrim = document.getElementById('scrim');
        const bottomSheet = document.getElementById('bottomSheet');
        const saveBtn = document.getElementById('saveBtn');

        saveBtn.addEventListener('click', () => {
            bottomSheet.classList.add('translate-y-full');
            scrim.classList.remove('opacity-100');
            scrim.classList.add('opacity-0');
            setTimeout(() => {
                scrim.classList.add('hidden');
            }, 300);
        });

        scrim.addEventListener('click', () => {
            bottomSheet.classList.add('translate-y-full');
            scrim.classList.remove('opacity-100');
            scrim.classList.add('opacity-0');
            setTimeout(() => {
                scrim.classList.add('hidden');
            }, 300);
        });
    </script>
